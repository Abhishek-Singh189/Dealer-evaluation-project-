<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dealer Evaluation</title>
<style>
  body{font-family:Arial,sans-serif;background:#f4f6f9;margin:0;padding:40px;color:#222}
  .card{max-width:560px;margin:auto;background:#fff;padding:28px;border-radius:10px;box-shadow:0 2px 10px rgba(0,0,0,.1)}
  h1{margin-top:0;font-size:24px}
  label{display:block;margin:18px 0 6px;font-weight:bold}
  select{width:100%;padding:10px;font-size:15px}
  table{width:100%;border-collapse:collapse;margin-top:20px}
  th,td{padding:10px;border-bottom:1px solid #ddd;text-align:left}
  th{background:#0f62fe;color:#fff}
  .price{margin-top:20px;font-size:20px;font-weight:bold;color:#0f62fe}
  .err{color:#c00}
</style>
</head>
<body>
<div class="card">
  <h1>Dealer Evaluation</h1>

  <label for="product">Product</label>
  <select id="product"><option value="">-- Select a product --</option></select>

  <label for="dealer">Dealer</label>
  <select id="dealer" disabled><option value="">-- Select a dealer --</option></select>

  <div id="result"></div>
</div>

<script>
  // ====== REPLACE THESE PLACEHOLDERS WITH YOUR DEPLOYED CODE ENGINE URLS (no trailing slash) ======
  const PRODUCT_API_URL = "https://PRODUCT_DETAILS_SERVICE_URL";   // Python microservice
  const PRICING_API_URL = "https://DEALER_PRICING_SERVICE_URL";    // Node.js microservice
  // ================================================================================================

  const productSel = document.getElementById("product");
  const dealerSel  = document.getElementById("dealer");
  const result     = document.getElementById("result");

  async function getJSON(url) {
    const r = await fetch(url);
    if (!r.ok) throw new Error("HTTP " + r.status);
    return r.json();
  }

  async function loadProducts() {
    try {
      const products = await getJSON(PRODUCT_API_URL + "/products");
      products.forEach(p => productSel.add(new Option(p, p)));
    } catch (e) {
      result.innerHTML = '<p class="err">Could not load products: ' + e.message + '</p>';
    }
  }

  productSel.addEventListener("change", async () => {
    result.innerHTML = "";
    dealerSel.length = 1;
    dealerSel.disabled = true;
    if (!productSel.value) return;
    try {
      const data = await getJSON(PRODUCT_API_URL + "/products/" + encodeURIComponent(productSel.value) + "/dealers");
      dealerSel.add(new Option("All Dealers", "ALL"));
      data.dealers.forEach(d => dealerSel.add(new Option(d.name, d.id)));
      dealerSel.disabled = false;
    } catch (e) {
      result.innerHTML = '<p class="err">Could not load dealers: ' + e.message + '</p>';
    }
  });

  dealerSel.addEventListener("change", async () => {
    result.innerHTML = "";
    const product = encodeURIComponent(productSel.value);
    if (!dealerSel.value) return;
    try {
      if (dealerSel.value === "ALL") {
        const data = await getJSON(PRICING_API_URL + "/price/" + product);
        let html = "<table><tr><th>Dealer</th><th>Price (USD)</th></tr>";
        data.prices.forEach(p => html += "<tr><td>" + p.dealer + "</td><td>$" + p.price + "</td></tr>");
        result.innerHTML = html + "</table>";
      } else {
        const data = await getJSON(PRICING_API_URL + "/price/" + product + "/" + dealerSel.value);
        result.innerHTML = '<div class="price">' + data.dealer + " price: $" + data.price + "</div>";
      }
    } catch (e) {
      result.innerHTML = '<p class="err">Could not load price: ' + e.message + '</p>';
    }
  });

  loadProducts();
</script>
</body>
</html>
